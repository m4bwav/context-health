# Runs the tool's test suite on the three operating systems it promises, so a change that only works
# on the author's machine cannot land unnoticed.
name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # actions/python-versions has no 3.9 build for Ubuntu 26.04 (3.9 is end of life), so the
        # 3.9 floor runs on 24.04 instead.
        exclude:
          - os: ubuntu-26.04
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: test suite
        run: python tests/test_ctxhealth.py
      - name: the tool answers from a clean checkout
        run: |
          python skills/context-health/ctxhealth.py version
          python skills/context-health/ctxhealth.py models --model claude-opus-5
          python skills/context-health/ctxhealth.py install --agent claude --dry-run
